<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>You on the Moors Now — Stage Props</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Inter+Tight:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kiosk.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body data-state="loading">
  <div id="stage" class="stage"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="focus" class="focus" aria-hidden="true"></div>

  <p class="mark"><span id="mark-title"></span></p>
  <p id="instruction" class="instruction"></p>
  <p id="message" class="message"></p>

  <!-- Landing: "how to play", shown while nobody is there -->
  <section id="intro" class="intro" aria-live="polite">
    <div class="intro-top">
      <p class="intro-kicker"><span id="intro-presenter"></span> · <span id="intro-title"></span></p>
      <h1 id="intro-headline" class="intro-headline"></h1>
      <p id="intro-tag" class="intro-tag"></p>
    </div>
    <div class="intro-bottom">
      <ol id="intro-steps" class="intro-steps"></ol>
      <div class="intro-cta"><span class="cta-arrow" aria-hidden="true">▸</span><span id="intro-cta"></span></div>
      <p id="intro-sub" class="intro-sub"></p>
    </div>
  </section>

  <!-- Get in position: someone has walked up but hasn't raised a hand yet -->
  <section id="ready" class="ready-hud" aria-live="polite">
    <p id="ready-kicker" class="ready-kicker"></p>
    <h2 id="ready-line" class="ready-line"></h2>
    <div class="ready-row">
      <div id="ready-cam" class="ready-cam"><span class="ready-you">You</span></div>
      <div class="meter" aria-hidden="true">
        <div class="meter-track"><span class="meter-zone"></span><span id="meter-dot" class="meter-dot"></span></div>
        <div class="meter-labels"><span>Too close</span><span>Perfect</span><span>Too far</span></div>
      </div>
    </div>
    <p id="ready-sub" class="ready-sub"></p>
  </section>

  <!-- "Got your hand!" -->
  <section id="hello" class="hello" aria-live="assertive">
    <p id="hello-line" class="hello-line"></p>
    <p id="hello-sub" class="hello-sub"></p>
  </section>
  <p id="whisper" class="whisper" aria-live="polite"></p>

  <!-- Cue card: the task the visitor is on -->
  <section id="cue" class="cue" aria-live="polite">
    <p id="cue-kicker" class="cue-kicker"></p>
    <h2 id="cue-title" class="cue-title"></h2>
    <p id="cue-text" class="cue-text"></p>
    <div class="cue-progress"><span id="cue-bar" class="cue-bar"></span></div>
    <p id="cue-hint" class="cue-hint"></p>
    <div id="cue-dots" class="cue-dots"></div>
  </section>
  <!-- Prompt book: all four cues, ticked off as they're done -->
  <aside id="checklist" class="checklist" aria-live="polite">
    <p id="checklist-head" class="checklist-head"></p>
    <ol id="checklist-items"></ol>
  </aside>
  <!-- "Cue complete" moment -->
  <section id="toast" class="toast" aria-live="assertive">
    <span class="toast-check">✓</span>
    <p id="toast-line" class="toast-line"></p>
    <p id="toast-sub" class="toast-sub"></p>
  </section>
  <!-- Free play: shown after all cues are done -->
  <section id="freeplay" class="freeplay" aria-live="polite">
    <p id="freeplay-line" class="freeplay-line"></p>
    <p id="freeplay-sub" class="freeplay-sub"></p>
  </section>
  <section id="finale" class="finale" aria-live="polite">
    <p class="finale-1"></p>
    <p class="finale-2"></p>
  </section>

  <p id="loading" class="loading">Preparing the stage…</p>

  <pre id="debug" class="debug" hidden></pre>

  <script type="module" src="src/main.js"></script>
</body>
</html>
